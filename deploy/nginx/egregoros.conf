# Example nginx reverse proxy for Egregoros with mini-app support.
#
# Replace social.example, media.social.example, certificate paths, and the
# upstream port for the deployment. This file is intended to be included from
# nginx's `http` context (for example through sites-enabled), because `map` and
# `upstream` are not valid inside a server block.
#
# Egregoros owns its route-specific Content-Security-Policy and other browser
# security headers. Do not add or hide CSP or X-Frame-Options here or in an
# enclosing nginx configuration/CDN. A second CSP is enforced in addition to
# the application's policy and can disable the mini-app broker.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream egregoros_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name social.example media.social.example;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name social.example;

    access_log /var/log/nginx/social.example-access.log;
    error_log /var/log/nginx/social.example-error.log;

    ssl_certificate /etc/letsencrypt/live/social.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Proxy every application route consistently. This includes ActivityPub,
    # OAuth, the mini-app broker and relay, assets, and Phoenix LiveView.
    location / {
        proxy_pass http://egregoros_backend;
        proxy_http_version 1.1;

        # Overwrite client-supplied forwarding headers at the trust boundary.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required by Phoenix LiveView and mini-app host events.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Broker pages, OAuth responses, authenticated HTML, and LiveView
        # traffic must not be cached or response-buffered by this proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

# Use a separate origin for uploads so uploaded content cannot inherit the
# application's origin privileges. Set:
#   EGREGOROS_UPLOADS_BASE_URL=https://media.social.example
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.social.example;

    access_log /var/log/nginx/media.social.example-access.log;
    error_log /var/log/nginx/media.social.example-error.log;

    ssl_certificate /etc/letsencrypt/live/media.social.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.social.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location ^~ /uploads/ {
        proxy_pass http://egregoros_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
    }

    # Do not expose the Egregoros application, API, OAuth endpoints, or
    # mini-app broker on the less-privileged media origin.
    location / {
        return 404;
    }
}
