<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fediverse Mini App Reference</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #f4f0e6; color: #181713; }
      main { box-sizing: border-box; max-width: 42rem; margin: auto; padding: 2rem 1.25rem; }
      section { border: 2px solid currentColor; background: #fffdf7; padding: 1rem; box-shadow: 5px 5px 0 #181713; }
      .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
      button { border: 2px solid #181713; background: #181713; color: #fffdf7; padding: .65rem .9rem; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { background: #fffdf7; color: #181713; }
      pre { min-height: 7rem; overflow-wrap: anywhere; white-space: pre-wrap; background: #e9e3d5; padding: .8rem; font-size: .75rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #181713; color: #f4f0e6; }
        section, button.secondary { background: #25231e; color: #f4f0e6; }
        button { border-color: #f4f0e6; background: #f4f0e6; color: #181713; }
        pre { background: #11100e; }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Fediverse Mini App Reference</h1>
        <p>This page works before authentication. Host context and wallet access happen only when requested.</p>
        <div class="actions">
          <button id="context" type="button">Request launch context</button>
          <button id="chain" type="button" class="secondary">Read wallet chain</button>
          <button id="connect" type="button" class="secondary">Connect wallet</button>
          <button id="external" type="button" class="secondary">Open ActivityPub spec</button>
          <button id="close" type="button" class="secondary">Close</button>
        </div>
        <pre id="output" aria-live="polite">Connecting to host…</pre>
      </section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
